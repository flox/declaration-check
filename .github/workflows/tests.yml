# This repository's own unit tests. Nothing else runs them, and no other
# repository cares about them — the check other repositories must pass is in
# declaration-check.yml.
name: tests

# No paths filter, deliberately. A required check that is skipped never reports,
# and a pull request waiting on a check that will never arrive is blocked for
# good — which is exactly what happened once to a pull request adding a CODEOWNERS
# file. The suite runs in well under a second; filtering saved nothing and cost a
# deadlock.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pyyaml
      - run: python3 -m unittest discover -p 'test_*.py' -v
